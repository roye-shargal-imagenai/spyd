<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<title>Connecting Slack to spyd…</title>
		<style>
			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				background: #0f1630;
				color: #f5f5f7;
				font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
				text-align: center;
			}
			a {
				color: #ff9aa4;
			}
			.muted {
				color: #a9b3cf;
			}
		</style>
	</head>
	<body>
		<div>
			<p id="status">Handing your Slack connection back to spyd…</p>
			<p class="muted">You can close this tab.</p>
			<p><a id="retry" href="#" hidden>Open spyd</a></p>
		</div>
		<script>
			// Slack refuses to redirect to a custom scheme or to localhost, so this
			// page exists only to bounce the auth code into the desktop app. It
			// forwards the query string untouched (code + state) and never reads,
			// stores, or transmits it anywhere else - there is no other JS here, no
			// analytics, and no network calls.
			(() => {
				var target = `odin://oauth/slack${window.location.search}`;
				var retry = document.getElementById("retry");
				retry.href = target;
				retry.hidden = false;
				if (!window.location.search) {
					document.getElementById("status").textContent =
						"This page expects a Slack redirect - nothing to hand over.";
					retry.hidden = true;
					return;
				}
				window.location.replace(target);
			})();
		</script>
	</body>
</html>
